- title: Run the Producer
  body: Start the 13 Years Producer on a Mac or iPad, or use a hosted headless Producer your team runs.
- title: Open a Pager
  body: Put an iPhone, iPad, Apple TV, Mac or ESP32 pager on the same network. It finds the Producer automatically, or you enter host:port.
- title: Choose a role
  body: Pick host, tech, band or any other role. You see STANDBY, GO, the countdown and your notes.
