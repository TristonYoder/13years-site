- title: STANDBY and GO in large colour
  body: A dark, high-contrast display that reads from across the stage. Amber for standby, green for go.
- title: Synced countdown
  body: The current item and its countdown, kept in step with the Producer on every pager.
- title: Notes for each role
  body: Host, tech, band and so on each see the notes meant for them, plus messages from the producer.
- title: Pulls the plan from Planning Center
  body: The Producer reads your service plan from Planning Center so you are not retyping it. Optional.
- title: Finds the Producer for you
  body: Pagers discover the Producer on your local network, or connect to a host and port you enter.
- title: Private by design
  body: No account, no analytics, no tracking, no advertising, and no server run by the developer.
