<header class="site wrap">
<a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}, home"><img class="th-l" src="{{ '/assets/img/mark-light.png' | relative_url }}" alt="" width="36" height="30"><img class="th-d" src="{{ '/assets/img/mark-dark.png' | relative_url }}" alt="" width="36" height="30"><span class="tape">{{ site.title }}</span></a>
<div class="bar-right">
<nav class="primary" aria-label="Primary"><ul>
{%- for item in site.data.nav.header %}
{%- assign anchor = item.url | slice: 0, 2 -%}
<li{% if anchor == "/#" %} class="anchor"{% endif %}><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
{%- endfor %}
</ul></nav>
{% include theme-toggle.html %}
</div>
</header>
